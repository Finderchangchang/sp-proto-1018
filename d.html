  } else if (S.step === 3) {
    h = `<p class="q">4. 顾客凭什么选你家？</p><div class="hint">最多选 2 个。</div>` + aiBox('AI 分析出店里有的东西', analysis('店里有什么')) +
      d.choices.reasons.map((o,i)=>opt(i, S.reasons.includes(i), true, esc(o.text), '', esc(o.why) + basis(o.basis))).join('');
  } else if (S.step === 4) {
    h = `<p class="q">5. 这周先做哪几件事？</p><div class="hint">多选，默认勾了前 3 件。</div>` + aiBox('AI 列出的限制和难处', analysis('限制和难处')) +
      d.week_actions.map((a,i)=>opt(i, S.acts.includes(i), true, esc(a.what), esc(a.how), `做完的样子：${esc(a.done)}`)).join('');
  } else if (S.step === 5) {
    h = `<p class="q">6. 抖音先上哪个团购？</p><div class="hint">单选，价格待核。</div>` +
      d.groupbuy.map((g,i)=>opt(i, S.gb===i, false, `${esc(g.name)}　<span style="color:#e8590c">¥${esc(g.price)}</span>`,
        `包含：${g.items.map(esc).join('、')}　·　菜单原价合计 ¥${esc(g.original)}　·　${esc(g.use_time)}`, esc(g.why))).join('') +
      opt(d.groupbuy.length, S.gb===d.groupbuy.length, false, '先不上团购', '', '');
  } else {
    const c = d.choices.customers[S.customer], s = d.choices.scenes[S.scene], g = d.groupbuy[S.gb];
    const line = `做「${c.text}」的生意；他们在「${s.text}」时来；靠${S.reasons.map(i=>'「'+d.choices.reasons[i].text+'」').join('和')}。`;
    h = `<p class="q">你的定位</p><p class="headline" style="font-size:20px">${esc(D.store)}：${esc(line)}</p>
<div class="hint">AI 推荐的定位句：${esc(d.headline)}（正式版会按你的选择重新写这一句）</div>
<ul class="sum" style="list-style:none;padding:0">
<li><span class="lb">方向</span>${esc(d.name)}<span class="edit" onclick="go(0)">改</span></li>
<li><span class="lb">做谁的生意</span>${esc(c.text)}<span class="edit" onclick="go(1)">改</span></li>
<li><span class="lb">什么时候来</span>${esc(s.text)}<span class="edit" onclick="go(2)">改</span></li>
<li><span class="lb">凭什么选你家</span>${S.reasons.map(i=>esc(d.choices.reasons[i].text)).join('；')}<span class="edit" onclick="go(3)">改</span></li>
<li><span class="lb">这周先做</span>${S.acts.length?S.acts.map(i=>esc(d.week_actions[i].what)).join('；'):'（没选）'}<span class="edit" onclick="go(4)">改</span></li>
<li><span class="lb">先上团购</span>${g?`${esc(g.name)} ¥${esc(g.price)}`:'先不上'}<span class="edit" onclick="go(5)">改</span></li></ul>
${Object.values(S.notes).some(v=>v&&v.trim())?`<div class="box" style="margin-top:6px"><h4>你补充的</h4><ul>${Object.entries(S.notes).filter(([k,v])=>v&&v.trim()).map(([k,v])=>`<li><span class="lb">${STEPS[k]}</span>${esc(v)}</li>`).join('')}</ul><div class="hint">正式版会把这些补充交给 AI，重新写定位句和后面的方案；原型里只做展示。</div></div>`:''}
<details><summary>查看完整分析过程</summary>${D.analysis.map(a=>`<div style="margin-top:8px"><b>${a.label}</b><ul>${a.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
<div style="margin-top:8px"><b>这个方向的五维比较</b><ul>${d.comparison.map(x=>`<li>${x.dim}：${esc(x.text)}</li>`).join('')}</ul></div></details>
<div class="actions"><button class="primary" onclick="toast('原型：这里点了就确认定位，进入爆品')">确认定位</button><button class="ghost" onclick="toast('原型：这里会打开店铺管家，说你想改哪一点')">我想改</button></div>`;
  }
  const ok = S.step !== 3 || S.reasons.length > 0;
  if (S.step < 6) h += noteBox();
  if (S.step < 6) h += `<div class="nav"><button class="ghost" ${S.step===0?'disabled':''} onclick="go(S.step-1)">上一步</button><button class="primary" ${ok?'':'disabled'} onclick="go(S.step+1)">${S.step===5?'看我的定位':'下一步'}</button></div>`;
  document.getElementById('stage').innerHTML = h;
}
function choose(i){
  const d = dir();
  if (S.step === 0) { const id = D.directions[i].id; if (id !== S.dir) { Object.assign(S, {dir:id, customer:0, scene:0, reasons:[0], acts:[0,1,2], gb:0}); } }
  else if (S.step === 1) S.customer = i;
  else if (S.step === 2) S.scene = i;
  else if (S.step === 3) { S.reasons = S.reasons.includes(i) ? S.reasons.filter(x=>x!==i) : (S.reasons.length >= 2 ? [S.reasons[1], i] : [...S.reasons, i]); }
  else if (S.step === 4) { S.acts = S.acts.includes(i) ? S.acts.filter(x=>x!==i) : [...S.acts, i].sort(); }
  else if (S.step === 5) S.gb = i;
  render();
}
function go(n){S.step = Math.max(0, Math.min(6, n)); render(); window.scrollTo(0,0)}
render();
</script></body></html>
