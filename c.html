<details><summary>为什么是这个方向</summary><ol>${d.reasons.map(r=>`<li>${esc(r.text)}</li>`).join('')}</ol></details>
<div class="step">本周要做的 5 件事</div>
${d.week_actions.map((a,i)=>`<label class="todo"><input type="checkbox" onchange="this.parentNode.classList.toggle('done',this.checked)"><div><div class="t">${i+1}. ${esc(a.what)}</div><div class="h">${esc(a.how)}</div><div class="d">做完的样子：${esc(a.done)}</div></div></label>`).join('')}
<div class="step">团购草案 <span class="tag">价格待核</span></div>
<div class="grid2">${d.groupbuy.map(g=>`<div class="gb"><div style="font-weight:600">${esc(g.name)}</div>

${g.price_warning?'<div class="warn">售价不低于菜单原价合计，需要重新定价</div>':''}
<div style="font-size:14px;margin-top:6px">包含：${g.items.map(esc).join('、')}</div>
${g.missing.length?`<div class="warn">菜单里没找到：${g.missing.map(esc).join('、')}，原价未计入</div>`:''}
<div style="font-size:13px;color:#646a73;margin-top:4px">核销时段：${esc(g.use_time)}</div>
<div style="font-size:13px;color:#646a73">${esc(g.why)}</div></div>`).join('')}</div>
<div class="actions"><button class="primary" onclick="toast('原型：这里点了就把这周的事派给运营')">就按这个做</button><button class="ghost" onclick="toast('原型：这里会打开店铺管家，说你想改哪一点')">我想改</button></div>`}
function pick(id){cur=id;renderChips();renderMain()}
renderChips();renderMain();
</script></body></html>
